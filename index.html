<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Этот раздел содержит метаданные, которые не отображаются на странице -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая веб-страница</title>
</head>
<body>
    <!-- Этот раздел содержит всё, что видит пользователь -->
    <header>
        <h1>Добро пожаловать на мой сайт!</h1>
        <nav>
            <ul>
                <li><a href="#about">Обо мне</a></li>
                <li><a href="#projects">Проекты</a></li>
                <li><a href="#contact">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <section id="about">
        <h2>Обо мне</h2>
        <p>Привет! Я начинающий веб-разработчик, изучающий HTML.</p>
        <img src="avatar.jpg" alt="Моя фотография" width="200" height="200">
    </section>
    
    <section id="projects">
        <h2>Мои проекты</h2>
        <article>
            <h3>Проект 1</h3>
            <p>Описание моего первого проекта.</p>
        </article>
    </section>
    
    <section id="contact">
        <h2>Связаться со мной</h2>
        <form>
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Сообщение:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            
            <button type="submit">Отправить</button>
        </form>
    </section>
    
    <footer>
        <p>&copy; 2025 Моё имя. Все права защищены.</p>
    </footer>
</body>
</html>
